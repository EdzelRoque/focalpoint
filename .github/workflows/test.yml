name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Real in-memory MongoDB, fake Claude, fake Redis. The live Claude eval
      # (npm run eval) is opt-in and never runs here.
      - run: npm test

  extension-test:
    runs-on: ubuntu-latest
    # Journey tests run the real backend, whose classification cache needs a
    # real Redis; the harness uses db index 15 on it.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            extension/package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      # The journey harness spawns the real backend (node app.js), so the
      # backend's dependencies must be installed too.
      - run: npm ci
        working-directory: backend
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journey-results
          path: |
            extension/test-results
            extension/test/.tmp/backend.log

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
