name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npx vitest run --passWithNoTests

  extension-test:
    runs-on: ubuntu-latest
    # Journey tests (Playwright) run a real local backend whose classification
    # cache needs a real Redis; the harness uses db index 15 on it.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npx vitest run
      # The journey harness spawns the real backend (node app.js), so the
      # backend's dependencies must be installed too.
      - run: npm install
        working-directory: backend
      - run: npx playwright install --with-deps chromium
      - run: |
          if find tests -name "*.spec.js" | grep -q .; then
            xvfb-run --auto-servernum npm test
          else
            echo "No test files found, skipping."
          fi